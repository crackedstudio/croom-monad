<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Croom on Monad</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #13171c; --line: #222932; --text: #e6e9ee;
    --dim: #8b949e; --accent: #7aa2f7; --good: #56d364; --bad: #f85149; --warn: #e3b341;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .tagline { color: var(--dim); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .row > .panel { flex: 1 1 280px; margin-bottom: 0; }
  .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .big { font-size: 20px; font-family: var(--mono); }
  .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.good { background: rgba(86,211,100,.14); color: var(--good); }
  .badge.bad { background: rgba(248,81,73,.14); color: var(--bad); }
  .badge.warn { background: rgba(227,179,65,.14); color: var(--warn); }
  .badge.dim { background: rgba(139,148,158,.14); color: var(--dim); }
  select, button {
    background: #1b2027; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 12px; font: inherit; font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #0b0d10; border-color: var(--accent); font-weight: 600; }
  a { color: var(--accent); }
  svg { display: block; width: 100%; height: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-family: var(--mono); }
  tr:last-child td { border-bottom: none; }
  .note { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Croom on Monad</h1>
    <p class="tagline">
      Markets whose price nobody can rig &mdash; not even the person who created them.
      This page computes the chart itself, from public randomness, in your browser.
    </p>
    <div id="app"></div>
  </div>
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
