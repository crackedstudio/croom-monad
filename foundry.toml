# Croom on Monad — toolchain is pinned, not floating.
# Rationale for every setting here: docs/toolchain.md

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned exactly. A derivation that is "bit-exact" against a compiler we did not
# pin is a claim about this afternoon, not about the artifact we submit.
solc_version = "0.8.28"

# Monad supports all opcodes as of the Fusaka fork (docs/monad-facts.md §2, verified
# against testnet at step 1.2), so Cancun is safely available. solc 0.8.28 tops out at
# cancun, which makes this the highest pin the pinned compiler can express.
evm_version = "cancun"

optimizer = true
optimizer_runs = 1_000_000

# 128 KB contract / 256 KB init code on Monad — we want `forge build --sizes`
# to be meaningful, so never silently allow oversized bytecode.
bytecode_hash = "none"
cbor_metadata = false

# Rounding is the whole game (PLAN.md §6). A truncation bug that only shows up
# one run in ten thousand is a bug we ship, so fuzz hard by default.
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 128, fail_on_revert = false }

# Deployment records are written by script/DeployProbe.s.sol. Scoped to one directory:
# a script that can write anywhere is a script that can rewrite its own source.
# Read-only, and only the fixtures. Deployment records are written by
# bin/record-deployment.py from the broadcast artifact, so no script needs write access.
fs_permissions = [{access = "read", path = "./test/fixtures"}]

# NOT in the default profile, deliberately. `deny = "warnings"` makes a lint finding abort
# `forge build` part-way, which leaves `out/` inconsistent — and a stale artifact directory has
# now produced two silent failures: a test count that dropped from 27 to 19 with a whole file
# missing, and a script that would not run with "No contract bytecode" while its artifact was
# plainly there. Lint is a gate, not a build step. CI enforces it (see [profile.ci]); locally
# `make lint` does, and a build that fails to build is the only thing a build failure means.

[profile.ci]
# Warnings are errors here, where an aborted build fails the job rather than leaving a trap.
deny = "warnings"
fuzz = { runs = 8192 }
invariant = { runs = 1024, depth = 256 }
verbosity = 3

# Nightly sweep (step 7.3): long fuzz, no shortcuts.
[profile.deep]
fuzz = { runs = 262_144 }
invariant = { runs = 8192, depth = 512 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[etherscan]
# Explorer/verifier details are filled in at step 1.1 from Network Information,
# not from memory.
