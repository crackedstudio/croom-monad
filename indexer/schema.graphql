"A Room: an immutable price process. The spec is the Room — its hash is the id."
type Room {
  id: ID!                      # roomId
  creator: String!
  spec: String!                # canonical 51-byte encoding, hex
  openedAt: BigInt!            # block number
  openedTx: String!
  checkpoints: [Checkpoint!]! @derivedFrom(field: "room")
  markets: [MarketRound!]! @derivedFrom(field: "room")
}

"""
One epoch's committed prices.

`leafRounds`/`leafCloses`/`leafHighs`/`leafLows` are the published leaves, kept because a
disproof is unconstructible without them. Posting them is the protocol's data-availability
rule; serving them is what lets a watcher who arrived late still catch a lie.
"""
type Checkpoint {
  id: ID!                      # roomId-epoch
  room: Room!
  epoch: BigInt!
  poster: String!
  merkleRoot: String!
  deadlineRound: BigInt!
  status: String!              # Pending | Final | Rejected
  postedAt: BigInt!
  postedTx: String!
  endPrice: BigInt
  rejectedBy: String
  rejectedRound: BigInt
  rejectedReason: String
  leafRounds: [BigInt!]!
  leafCloses: [BigInt!]!
  leafHighs: [BigInt!]!
  leafLows: [BigInt!]!
}

"""
A parimutuel market over one window of a Room.

Named MarketRound rather than Market because `generated` exports contract handlers and entity
types from one module, and config.yaml already has a contract called Market. Two bindings of the
same name cannot both be exported, so the collision has to be resolved here.
"""
type MarketRound {
  id: ID!                      # marketId
  room: Room!
  startRound: BigInt!
  endRound: BigInt!
  state: String!               # Open | Settled | Void
  upTotal: BigInt!
  downTotal: BigInt!
  winner: String
  startClose: BigInt
  endClose: BigInt
  rake: BigInt
  openedAt: BigInt!
  stakes: [Stake!]! @derivedFrom(field: "market")
}

type Stake {
  id: ID!                      # marketId-staker-side
  market: MarketRound!
  staker: String!
  side: String!                # Up | Down
  amount: BigInt!
  claimed: Boolean!
  payout: BigInt
}

"One row, so the frontend can show how far behind the indexer is rather than implying it is live."
type Protocol {
  id: ID!
  rooms: BigInt!
  checkpoints: BigInt!
  rejected: BigInt!
  markets: BigInt!
  settled: BigInt!
  totalStaked: BigInt!
}
